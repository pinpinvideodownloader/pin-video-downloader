{id:'tobe',title:'O trio AM · IS · ARE',icon:'🧩',minutes:10,desc:'O verbo ser ou estar',color:'#e5f8e9',exercises:[fill('I ___ happy.','am','Eu estou feliz.','😄','I am happy.','I só combina com AM.'),fill('She ___ my sister.','is','Ela é minha irmã.','👧','She is my sister.','He, She e It usam IS.'),fill('He ___ my brother.','is','Ele é meu irmão.','👦','He is my brother.'),fill('You ___ my friend.','are','Você é meu amigo.','🤝','You are my friend.'),fill('We ___ happy.','are','Nós estamos felizes.','🥳','We are happy.'),fill('They ___ students.','are','Eles são estudantes.','🎒','They are students.'),fill('It ___ a dog.','is','É um cachorro.','🐕','It is a dog.'),fill('I ___ Fernando.','am','Eu sou Fernando.','🙋','I am Fernando.'),fill('She ___ at home.','is','Ela está em casa.','🏠','She is at home.'),fill('We ___ friends.','are','Nós somos amigos.','🤜🤛','We are friends.')]},

const totalQuestions=phases.reduce((sum,l)=>sum+l.exercises.length,0);
let state=load();let hintVisible=false,optionsRevealed=false,attemptFeedback='',isComplete=false,selectedOption=null,micBusy=false,recognizer=null,voiceEnabled=true,speed=.87,modal=null;let lastHeard='';
function load(){try{const x=JSON.parse(localStorage.getItem(LS_KEY)||'{}');return {phase:Number.isInteger(x.phase)?Math.min(Math.max(x.phase,0),phases.length):0,step:Number.isInteger(x.step)?Math.max(x.step,0):0,stars:Math.max(0,x.stars||0),completed:x.completed||{},started:x.started||null,oral:x.oral||0,voiceAnswers:x.voiceAnswers||0}}catch{return {phase:0,step:0,stars:0,completed:{},started:null,oral:0,voiceAnswers:0}}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch{}}
function safe(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9\s']/g,' ').replace(/don't/g,'dont').replace(/\s+/g,' ').trim()}
function checkSpeech(heard,q){let n=normalize(heard);if(!n)return false;const targets=q.accept||[q.correct];return targets.some(t=>{let x=normalize(t);if(n===x||n===`it's ${x}`||n===`it is ${x}`||n===`the ${x}`)return true;if(x.length>7 && (n.includes(x)||x.includes(n)&&n.length>7))return true; if(x==='i'&&['eye','aye'].includes(n))return true;if(x==='we'&&['wee','oui'].includes(n))return true;if(x==='he'&&['hee'].includes(n))return true;if(x==='are'&&['r'].includes(n))return true;if(x==='a'&&['uh'].includes(n))return true;if(x==='an'&&['ann'].includes(n))return true;return false})}
function pickVoice(lang){const vs=window.speechSynthesis?.getVoices?.()||[];const prefix=lang.slice(0,2).toLowerCase();let choices=vs.filter(v=>v.lang.toLowerCase().startsWith(prefix));if(lang.startsWith('en'))choices.sort((a,b)=>((/en-us/i.test(b.lang)?2:0)+(/natural|google|aria|jenny|zira/i.test(b.name)?3:0))-((/en-us/i.test(a.lang)?2:0)+(/natural|google|aria|jenny|zira/i.test(a.name)?3:0)));return choices[0]||null}
function audioStatus(msg){const el=document.getElementById('audio-status');if(el)el.textContent=msg;}
function say(text,lang='en-US',rate=speed){if(!voiceEnabled){audioStatus('🔇 A voz está desligada. Toque em Voz para ativar.');return;}const syn=window.speechSynthesis;if(!syn){audioStatus('🔇 Este navegador não reproduz fala. Use Chrome ou Edge.');return;}try{syn.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=1.02;u.volume=1;const v=pickVoice(lang);if(v)u.voice=v;u.onstart=()=>audioStatus('🔊 A voz está falando. Escute e repita!');u.onend=()=>audioStatus('🎙️ Sua vez! Repita em voz alta ou responda.');u.onerror=()=>audioStatus('🔇 Não saiu som. Abra no Chrome ou Edge, confira o volume e tente novamente.');syn.speak(u);audioStatus('🔊 Preparando a fala em inglês...');}catch(e){audioStatus('🔇 Não consegui iniciar a voz. Abra no Chrome ou Edge.')}}
function sayTwo(first,second){if(!voiceEnabled){audioStatus('🔇 Ative a voz para escutar.');return;}const syn=window.speechSynthesis;if(!syn){audioStatus('🔇 O som falado precisa do Chrome ou Edge.');return;}try{syn.cancel();for(const [txt,lang,rate] of [[first,'pt-BR',.98],[second,'en-US',speed]]){const u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=rate;u.pitch=1.02;const v=pickVoice(lang);if(v)u.voice=v;u.onstart=()=>audioStatus(lang==='en-US'?'🔊 Escute o inglês e repita!':'🔊 Uma explicação rápida...');u.onerror=()=>audioStatus('🔇 Confira o volume ou abra no Chrome/Edge.');syn.speak(u)}audioStatus('🔊 Áudio ativado. Confira o volume do aparelho.');}catch(e){audioStatus('🔇 Falha no áudio. Abra no Chrome ou Edge.')}}
function speakQuestion(slow=false){const q=current();if(!q)return;let t=q.promptVoice||q.question;say(t,q.lang||'en-US',slow?.66:speed)}
function speakAnswer(slow=false){const q=current();if(!q)return;say(q.after||q.correct,'en-US',slow?.65:speed)}
function current(){return phases[state.phase]?.exercises[state.step]||null}
function key(){return `${state.phase}:${state.step}`}
function resetView(){hintVisible=false;optionsRevealed=false;attemptFeedback='';selectedOption=null;lastHeard='';isComplete=!!state.completed[key()];if(isComplete)selectedOption=state.completed[key()]?.answer||null}
function confetti(){const el=document.getElementById('confetti');el.innerHTML='';for(let i=0;i<42;i++){const d=document.createElement('span');d.className='confetti-bit';d.style.left=`${Math.random()*100}%`;d.style.background=mix[i%mix.length];d.style.animationDelay=`${Math.random()*.65}s`;d.style.borderRadius=Math.random()>.5?'5px':'0';el.appendChild(d)}setTimeout(()=>el.innerHTML='',2400)}
function setFeedback(text,type='try'){attemptFeedback=`<div class="feedback ${type}" aria-live="polite">${safe(text)}</div>`;const slot=document.getElementById('feedback-slot');if(slot)slot.innerHTML=attemptFeedback}
function complete(method='tap',said=''){if(isComplete)return;const q=current();if(!q)return;isComplete=true;const award=(method==='voice'?3:2);state.stars+=award;state.completed[key()]={method,said,answer:selectedOption||q.correct,at:Date.now()};if(method==='voice')state.voiceAnswers++;state.oral++;save();const sentence=q.kind==='likes'?(selectedOption||(/^no/i.test(said)?"No, I don't.":'Yes, I do.')):q.after||q.correct;setFeedback(`Muito bem, Fernando! 🌟 +${award} estrelas. Agora ouça e repita: ${sentence}`,'ok');say(sentence,'en-US',.84);render();confetti()}
function chooseAnswer(index){const q=current();if(!q||isComplete)return;const o=q.options[index];if(o===undefined)return;selectedOption=o;optionsRevealed=true;if(q.kind==='likes'||o===q.correct){complete('tap')}else{setFeedback('Quase! Você pode tentar de novo. Escute a dica e fale em voz alta.','try');render()}}
function autoAdvance(){if(state.phase>=phases.length)return;const q=current();if(q && !isComplete){setFeedback('Antes, tente responder à pergunta! Se precisar, use as alternativas.');return}state.step++;resetView();save();render();if(current())speakQuestion()}
function goPhase(id){const n=phases.findIndex(p=>p.id===id);if(n<0)return;state.phase=n;state.step=0;resetView();save();render();if(current())speakQuestion()}
function movePhase(){if(state.phase===phases.length-1){state.phase=phases.length}else{state.phase++;state.step=0}resetView();save();render();if(current())speakQuestion()}
function start(){state.started=state.started||Date.now();save();render();sayTwo('Olá, Fernando! Sua aventura vai começar. Aperte ouvir para repetir as palavras.','Hello, Fernando! Are you ready?')}
function startMic(){const q=current();if(!q)return;if(!REC){openHelp('mic');return}if(micBusy)return;try{window.speechSynthesis?.cancel();recognizer=new REC();recognizer.lang='en-US';recognizer.interimResults=false;recognizer.continuous=false;recognizer.maxAlternatives=4;micBusy=true;document.getElementById('mic-status').innerHTML='<span class="micdot"></span> Ouvindo... Fale agora!';recognizer.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript.trim());const heard=alts[0]||'';lastHeard=heard;micBusy=false;const ok=alts.some(t=>checkSpeech(t,q));if(ok){selectedOption=q.kind==='likes'&&alts.some(t=>/\bno\b/i.test(t))?"No, I don't.":q.correct;complete('voice',heard)}else{setFeedback(`Eu ouvi: “${heard||'...'}”. Talvez o microfone não tenha entendido. Tente outra vez ou confira pela tela. Você não perde estrelas!`,'try');render()}};recognizer.onerror=e=>{micBusy=false;const err=e.error||'erro';if(err==='not-allowed'||err==='service-not-allowed'){setFeedback('O navegador não autorizou o microfone. Abra este arquivo no Chrome ou Edge, permita o microfone ou use as alternativas.','try')}else{setFeedback('Não consegui reconhecer agora. Você pode continuar falando e escolher a resposta na tela.','try')}render()};recognizer.onend=()=>{micBusy=false;let slot=document.getElementById('mic-status');if(slot)slot.textContent='';};recognizer.start()}catch(e){micBusy=false;setFeedback('Reconhecimento de voz não disponível aqui. O treino continua com os botões!','try');render()}}
function spoken(){if(isComplete)return;if(!current())return;optionsRevealed=true;if(current().kind==='repeat'){selectedOption=current().correct;complete('tap','falei sozinho')}else{setFeedback('Muito bem por tentar falar! Agora escolha na tela o que você disse para conferir.','ok');render()}}

function quizHTML(){const p=phases[state.phase];const q=current();if(!q)return doneHTML();const num=state.step+1;const pPct=100*state.step/p.exercises.length;const addChoices=!isComplete&&(p.id!=='final'||optionsRevealed);let localHelp=hintVisible?`<div class="hint"><strong>💡 Dica da raposinha</strong><p>${safe(q.translation)}</p><p>${safe(q.hint)}</p></div>`:'';let answerInfo=isComplete?`<div class="feedback ok" aria-live="polite">🌟 Muito bem! Resposta: <strong>${safe(q.kind==='likes'?(selectedOption||q.correct):q.after||q.correct)}</strong> Ouça e repita mais uma vez.</div>`:'';return `<div class="quiz-card" style="--accent-soft:${p.color}"><div class="moduleline"><span>Desafio ${num} de ${p.exercises.length}</span><span>${p.minutes} min para esta fase</span></div><div class="progress-track" aria-label="Progresso da fase"><div class="progress-fill" style="width:${pPct}%"></div></div>${stageBadge()}<div class="illustration" role="img" aria-label="Ilustração do desafio">${q.icon||'⭐'}</div><div class="question">${safe(q.question)}</div>${q.kind==='repeat'?`<div style="font-size:2.4rem;font-weight:900;color:#6240c8;background:#f5f0ff;border-radius:18px;padding:14px 20px;display:inline-block;margin:0 0 12px">${safe(q.focus)}</div>`:''}<p class="help-text">${q.kind==='likes'?'Diga se VOCÊ gosta ou não. As duas respostas podem estar certas.':q.kind==='repeat'?'Clique em OUVIR e repita de verdade!':p.id==='final'?'PROVA ORAL: tente responder sem ler as alternativas.':'Primeiro, tente responder FALANDO. Depois confira na tela.'}</p><p id="audio-status" style="font-weight:800;color:#593aad">🔊 Toque em OUVIR para escutar em inglês.</p><div class="speakerline"><button class="btn primary" data-action="speak">🔊 OUVIR ${q.kind==='repeat'?'A PALAVRA':'A PERGUNTA'}</button><button class="btn secondary" data-action="slow">🐢 Mais devagar</button>${isComplete?`<button class="btn green" data-action="answer-audio">✅ Ouvir resposta</button>`:''}</div>${!isComplete?`<div class="speakerline"><button class="btn orange" data-action="mic" ${!REC?'title="O reconhecimento de voz funciona melhor no Chrome ou Edge"':''}>🎙️ Responder falando</button><button class="btn white" data-action="spoken">🙋 Já falei!</button></div><div id="mic-status" style="font-weight:900;color:#9b4470;margin:6px 0" aria-live="polite"></div>`:''}<div id="feedback-slot">${attemptFeedback||''}</div>${localHelp}${answerInfo}${addChoices&&q.options.length?`<div class="choices">${q.options.map((o,i)=>`<button class="choice ${selectedOption===o?'incorrect':''}" data-choose="${i}">${safe(o)}</button>`).join('')}</div>`:''}${!isComplete&&p.id==='final'&&!optionsRevealed?`<button class="btn small ghost" data-action="reveal-options">👀 Mostrar alternativas se precisar</button>`:''}${!isComplete?`<div class="action-row"><button class="btn small ghost" data-action="hint">💡 ${hintVisible?'Esconder ajuda':'Ver tradução e dica'}</button>${q.kind==='repeat'?`<span class="tiny">Aperte “Já falei!” depois de repetir.</span>`:''}</div>`:''}<div class="bottom-row"><span class="muted tiny">💜 Errou? Tente de novo, sem perder pontos.</span><div style="display:flex;gap:8px"><button class="btn small white" data-action="back" ${state.step===0?'disabled':''}>← Voltar</button><button class="btn ${isComplete?'primary':'secondary'}" data-action="next" ${!isComplete?'disabled':''}>${state.step===p.exercises.length-1?'Terminar fase 🏁':'Próximo desafio →'}</button></div></div></div>`}
function doneHTML(){const p=phases[state.phase];const last=state.phase===phases.length-1;return `<div class="quiz-card stage-done"><span class="bigicon">${last?'🏆':'🎊'}</span><div class="eyebrow">FASE CONCLUÍDA</div><h2>${last?'Fernando, você terminou a prova simulada!':`Uhuu! Você venceu a fase ${safe(p.title)}!`}</h2><p>${last?'Agora você já praticou as perguntas que podem aparecer na prova oral. Volte às fases que ficaram difíceis ou treine mais uma vez.':'Você treinou falando em inglês. Seu cérebro está ficando cada vez mais rápido para entender a professora.'}</p><div class="final-score">⭐ ${state.stars} estrelas conquistadas</div><button class="btn primary" data-action="advance">${last?'🏆 VER MEU DIPLOMA':'🚀 IR PARA A PRÓXIMA FASE'}</button><div style="margin-top:14px"><button class="btn ghost small" data-phase="${p.id}">🔁 Repetir esta fase</button></div></div>`}

function render(){document.getElementById('app').innerHTML=state.started?game():home();if(modal)renderModal()}
function openHelp(which){modal=which;renderModal()}
function renderModal(){let el=document.getElementById('modal-overlay');if(!modal){el?.remove();return}if(!el){el=document.createElement('div');el.id='modal-overlay';el.className='overlay';document.body.appendChild(el)}const isSettings=modal==='settings',isMic=modal==='mic',isCert=modal==='certificate';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${isCert?'Diploma':isMic?'Microfone':'Configuração da voz'}"><div class="row"><h2>${isCert?'🏆 Diploma do Fernando':isMic?'🎤 Como usar o microfone?':'🔊 Configuração da voz'}</h2><button class="btn small ghost" data-action="close-modal">✕ Fechar</button></div>${isCert?`<div class="cert"><div style="font-size:3.3rem">🥇🌟🥇</div><div class="smallcap">CERTIFICADO ESPECIAL</div><div class="cert-title">SUPERSTAR DO INGLÊS</div><div class="cert-name">FERNANDO</div><p>Participou com coragem do <b>Show do Inglês</b> e aprendeu a ouvir, entender e responder perguntas em inglês!</p><h3>⭐ ${state.stars} estrelas ⭐</h3><div style="margin-top:25px">Parabéns! Continue brilhando!</div></div><button class="btn primary" data-action="print">🖨️ Imprimir diploma</button>`:isMic?`<p>Para o site tentar entender a resposta falada, abra o arquivo usando <b>Google Chrome ou Microsoft Edge</b> e permita o acesso ao microfone quando solicitado. O reconhecimento pode depender de conexão com a internet.</p><p>Se não funcionar, basta usar <b>🔊 Ouvir</b>, dizer a resposta em voz alta e clicar em <b>🙋 Já falei!</b>. Você não fica impedido de jogar.</p><p style="font-size:.88rem">O site não salva gravações. O serviço de reconhecimento do navegador pode processar a fala fora do dispositivo.</p><button class="btn primary" data-action="close-modal">Entendi 👍</button>`:`<p>O site usa as vozes disponíveis no seu navegador. A voz em inglês fala as perguntas, e as dicas em português ajudam a entender.</p><label class="speed-control">Velocidade da voz: <input id="speed" type="range" min="0.65" max="1.12" step="0.01" value="${speed}"/> <span id="speed-label">${Math.round(speed*100)}%</span></label><div class="action-row"><button class="btn primary" data-action="test-voice">🔊 Testar voz</button><button class="btn white" data-action="toggle-voice">${voiceEnabled?'🔇 Desligar':'🔊 Ligar'} voz</button></div><p class="tiny">Se não escutar nada, verifique o volume do computador e experimente o Edge ou Chrome.</p>`}</div>`}
function closeModal(){modal=null;document.getElementById('modal-overlay')?.remove()}
function restart(){if(confirm('Quer reiniciar tudo e apagar as estrelas?')){state={phase:0,step:0,stars:0,completed:{},started:null,oral:0,voiceAnswers:0};save();resetView();render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action],[data-phase],[data-choose]');if(!t)return;if(t.hasAttribute('data-phase')){if(!state.started)state.started=Date.now();goPhase(t.dataset.phase);return}if(t.hasAttribute('data-choose')){chooseAnswer(+t.dataset.choose);return}switch(t.dataset.action){case'start':start();break;case'settings':openHelp('settings');break;case'test-voice':sayTwo('Olá Fernando! Agora você vai ouvir a voz em inglês.','Hello, Fernando! I am happy. Are you ready?');break;case'close-modal':closeModal();break;case'toggle-voice':voiceEnabled=!voiceEnabled;if(!voiceEnabled)window.speechSynthesis?.cancel();renderModal();break;case'speak':speakQuestion();break;case'slow':speakQuestion(true);break;case'answer-audio':speakAnswer();break;case'mic':startMic();break;case'spoken':spoken();break;case'hint':hintVisible=!hintVisible;render();break;case'reveal-options':optionsRevealed=true;render();break;case'next':autoAdvance();break;case'back':state.step=Math.max(0,state.step-1);resetView();save();render();break;case'advance':movePhase();break;case'certificate':openHelp('certificate');break;case'print':window.print();break;case'review-final':goPhase('final');break;case'restart':restart();break;}});
document.addEventListener('input',e=>{if(e.target?.id==='speed'){speed=+e.target.value;document.getElementById('speed-label').textContent=`${Math.round(speed*100)}%`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
// Voltar ao jogo sem perder progresso, inclusive quando o navegador for fechado acidentalmente.
if(state.phase>=phases.length){state.step=0}else{state.step=Math.min(state.step,phases[state.phase].exercises.length)}resetView();render();setInterval(()=>{let t=document.getElementById('clock');if(t)t.textContent='⏱️ '+clockText()},30000);
</script>
</body>
</html>
